name: CI

on:
  push:
  pull_request:

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpcs

  theme-json:
    name: theme.json schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate theme.json and every style variation
        run: npm run lint:json

  package:
    name: Build installable zip
    runs-on: ubuntu-latest
    needs: [php-syntax, coding-standards, theme-json]
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --prefix=fieldnote/ -o fieldnote.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fieldnote-theme
          path: fieldnote.zip
